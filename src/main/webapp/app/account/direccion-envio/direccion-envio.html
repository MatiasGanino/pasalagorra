<div class="d-flex justify-content-center">
  <div class="col-md-8">
    <h2>Dirección de envío</h2>
    <p class="text-muted">La usan los artistas para mandarte las recompensas que requieren envío.</p>

    @if (guardada()) {
      <div class="alert alert-success"><strong>¡Dirección guardada!</strong></div>
    }

    <jhi-alert-error />

    <form name="form" (ngSubmit)="guardar()" [formGroup]="form" novalidate>
      <div class="row">
        <div class="col-8 mb-3">
          <label class="form-label" for="calle">Calle</label>
          <input type="text" class="form-control" id="calle" formControlName="calle" />
        </div>
        <div class="col-4 mb-3">
          <label class="form-label" for="numero">Número</label>
          <input type="text" class="form-control" id="numero" formControlName="numero" />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="pisoDepto">Piso / depto <small class="text-muted">(opcional)</small></label>
        <input type="text" class="form-control" id="pisoDepto" formControlName="pisoDepto" />
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="localidad">Localidad</label>
          <input type="text" class="form-control" id="localidad" formControlName="localidad" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="provincia">Provincia</label>
          <select class="form-select" id="provincia" formControlName="provincia">
            <option value="" disabled>Elegí una provincia</option>
            @for (provincia of provincias; track provincia) {
              <option [value]="provincia">{{ provincia }}</option>
            }
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="codigoPostal">Código postal</label>
          <input type="text" class="form-control" id="codigoPostal" formControlName="codigoPostal" />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="telefono">Teléfono <small class="text-muted">(opcional)</small></label>
          <input type="tel" class="form-control" id="telefono" formControlName="telefono" />
        </div>
      </div>

      <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Guardar</button>
    </form>
  </div>
</div>
