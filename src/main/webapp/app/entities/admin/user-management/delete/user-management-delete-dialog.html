@if (userManagement) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(userManagement.login)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="userManagementDeleteDialogHeading" jhiTranslate="entity.delete.title">
        Confirmar operación de borrado
      </h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-userManagement-heading"
        jhiTranslate="userManagement.delete.question"
        [translateValues]="{ id: userManagement.login }"
      >
        ¿Seguro que quieres eliminar el usuario {{ userManagement.login }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
      </button>

      <button id="jhi-confirm-delete-userManagement" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Eliminar</span>
      </button>
    </div>
  </form>
}
