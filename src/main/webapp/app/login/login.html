<div class="tarjeta-acceso">
  <span class="eyebrow mb-2">Ingresar</span>
  <h1 class="h2 mb-1" data-cy="loginTitle" jhiTranslate="login.title">Hola de nuevo</h1>
  <p class="text-body-secondary mb-4">Entrá para aportar y seguir tus campañas.</p>

  @if (authenticationError()) {
    <div class="alert alert-danger" data-cy="loginError" jhiTranslate="login.messages.error.authentication">
      <strong>No pudimos iniciar la sesión.</strong> Revisá el usuario y la contraseña.
    </div>
  }
  <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
    <div class="mb-3">
      <label class="form-label" for="username" jhiTranslate="global.form.username.label">Usuario</label>
      <input
        type="text"
        #username
        class="form-control form-control-lg"
        name="username"
        id="username"
        autocomplete="username"
        placeholder="{{ 'global.form.username.placeholder' | translate }}"
        formControlName="username"
        data-cy="username"
      />
    </div>

    <div class="mb-2">
      <div class="d-flex justify-content-between align-items-baseline">
        <label class="form-label" for="password" jhiTranslate="login.form.password">Contraseña</label>
        <a class="small" routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector" jhiTranslate="login.password.forgot"
          >¿Te olvidaste la contraseña?</a
        >
      </div>
      <input
        type="password"
        class="form-control form-control-lg"
        name="password"
        id="password"
        autocomplete="current-password"
        placeholder="{{ 'login.form.password.placeholder' | translate }}"
        formControlName="password"
        data-cy="password"
      />
    </div>

    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
      <label class="form-check-label" for="rememberMe" jhiTranslate="login.form.rememberme">Mantener la sesión iniciada</label>
    </div>

    <button type="submit" class="btn btn-primary btn-lg w-100" data-cy="submit" jhiTranslate="login.form.button">Ingresar</button>
  </form>

  <p class="text-center mt-4 mb-0">
    <span jhiTranslate="global.messages.info.register.noaccount">¿Todavía no tenés cuenta?</span>
    <a routerLink="/account/register" class="fw-semibold" jhiTranslate="global.messages.info.register.link">Creá una</a>
  </p>
</div>
