<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="es">
  <head>
    <title th:text="#{email.campania.aprobada.title}">Campaña publicada</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <p th:text="#{email.activation.greeting(${user.login})}">Estimado/a</p>
    <p>Aprobamos tu campaña <strong th:text="${titulo}">título</strong> y ya está publicada. Compartila con tus fans:</p>
    <p>
      <a th:with="url=(@{|${baseUrl}/campania/${slug}|})" th:href="${url}" th:text="${url}">Ver campaña</a>
    </p>
    <p>
      <span th:text="#{email.activation.text2}">Saludos,</span>
      <br />
      <em th:text="#{email.signature}">Equipo de pasalagorra.</em>
    </p>
  </body>
</html>
